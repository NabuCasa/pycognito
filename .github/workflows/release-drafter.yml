name: Release Drafter

on:
  push:
    # branches to consider in the event; optional, defaults to all
    branches:
      - master

permissions:
  contents: read

jobs:
  update_release_draft:
    runs-on: ubuntu-latest
    permissions:
      # create and update the draft release
      contents: write
      # read merged pull requests and their labels
      pull-requests: read
    steps:
      # v7 reads the token from the `token` input, which defaults to github.token
      - uses: release-drafter/release-drafter@978bb0b30c5ee8cdd332ced253758157150d43f0 # v7.10.0
