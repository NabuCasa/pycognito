repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.4
    hooks:
      # ruff 0.17+ also formats Markdown code blocks; keep the hooks to Python
      - id: ruff-check
        types_or: [python, pyi]
        args: [--fix, --exit-non-zero-on-fix, --config, pyproject.toml]
      - id: ruff-format
        types_or: [python, pyi]
        args: [--config, pyproject.toml]
